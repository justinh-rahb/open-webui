<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open WebUI Embed Demo</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 2rem;
        background: #f7f8fa;
        color: #111827;
      }
      .card {
        max-width: 900px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 1.5rem;
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }
      code {
        background: #f3f4f6;
        padding: 0.15rem 0.35rem;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Open WebUI Embed Demo</h1>
      <p>
        This page loads the embedded chatbot panel
        <code>panel-embed-test</code> from
        <code>https://open-webui.open-webui.orb.local</code>.
      </p>
    </div>

    <script>
      (function () {
        const panelId = "panel-embed-test";
        const apiBaseUrl = "http://localhost:3000";

        const showError = (message) => {
          const card = document.querySelector(".card");
          if (!card) return;
          const el = document.createElement("p");
          el.style.color = "#b91c1c";
          el.style.marginTop = "0.75rem";
          el.textContent = message;
          card.appendChild(el);
        };

        const createWidget = (token) => {
          const container = document.createElement("div");
          container.style.position = "fixed";
          container.style.right = "20px";
          container.style.bottom = "20px";
          container.style.zIndex = "2147483000";
          container.style.display = "flex";
          container.style.flexDirection = "column";
          container.style.alignItems = "flex-end";
          container.style.gap = "12px";

          const iframe = document.createElement("iframe");
          iframe.src = `${apiBaseUrl}/embed/${encodeURIComponent(panelId)}?token=${encodeURIComponent(token)}`;
          iframe.title = "Open WebUI Chat";
          iframe.style.width = "380px";
          iframe.style.height = "620px";
          iframe.style.border = "0";
          iframe.style.borderRadius = "16px";
          iframe.style.boxShadow = "0 16px 48px rgba(0,0,0,0.25)";
          iframe.style.background = "#fff";
          iframe.style.display = "none";
          iframe.setAttribute("allow", "clipboard-read; clipboard-write");

          const button = document.createElement("button");
          button.type = "button";
          button.textContent = "Chat";
          button.style.border = "0";
          button.style.borderRadius = "999px";
          button.style.padding = "12px 16px";
          button.style.background = "#111827";
          button.style.color = "#fff";
          button.style.fontFamily = "ui-sans-serif, system-ui, sans-serif";
          button.style.fontSize = "14px";
          button.style.cursor = "pointer";
          button.style.boxShadow = "0 6px 20px rgba(0,0,0,0.18)";

          let opened = false;
          button.addEventListener("click", () => {
            opened = !opened;
            iframe.style.display = opened ? "block" : "none";
          });

          container.appendChild(iframe);
          container.appendChild(button);
          document.body.appendChild(container);
        };

        fetch(apiBaseUrl + "/api/v1/auths/embed/token", {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ panel_id: panelId })
        })
          .then(async (response) => {
            if (!response.ok) {
              throw new Error(`Failed to create embed token (${response.status}). Ensure you're signed in at ${apiBaseUrl}.`);
            }
            const json = await response.json();
            if (!json?.token) {
              throw new Error("Embed token response did not include a token.");
            }
            createWidget(json.token);
          })
          .catch((error) => {
            showError(error instanceof Error ? error.message : "Failed to initialize embed widget.");
          });
      })();
    </script>
  </body>
</html>
